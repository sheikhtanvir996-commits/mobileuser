name: Daily Auto Blogger Post

on:
  schedule:
    - cron: '0 4 * * *'  # প্রতিদিন বাংলাদেশ সময় সকাল ১০টায় অটো রান হবে (UTC 4:00 AM)
  workflow_dispatch:     # আপনি চাইলে ম্যানুয়ালিও বাটনে ক্লিক করে রান করতে পারবেন

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install groq google-api-python-client google-auth

    - name: Run Auto Post Script
      env:
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
        BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
        BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
        BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
      run: python auto_post.py
